services:
  db:
    image: postgres:16
    container_name: kakeibo-db
    # restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: kakeibo
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: kakeibo-pgadmin
    # restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "8081:80"
    depends_on:
      - db
    volumes:
      - pgadmin-data:/var/lib/pgadmin

  backend:
    build:
      context: ../
      dockerfile: docker/backend/Dockerfile
    image: kakeibo-backend
    container_name: kakeibo-backend
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    ports:
      - "8080:8080"
    depends_on:
      - db

  frontend:
    build:
      context: ../
      dockerfile: docker/frontend/Dockerfile
    image: kakeibo-frontend
    container_name: kakeibo-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  db-data:
  pgadmin-data:
