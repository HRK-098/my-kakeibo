spring.application.name=kakeibo-backend

# CORS settings
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173}

# Docker PostgreSQL settings
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://db:5432/kakeibo}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Gemini API Key
gemini.api.key=${GEMINI_API_KEY:}
